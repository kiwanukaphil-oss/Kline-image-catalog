<div id="kline-concept" aria-label="K-Line stock preparation concept">
  <style>
    #kline-concept{--kl-bg:light-dark(#f6f5f1,#17191d);--kl-paper:light-dark(#fff,#22252b);--kl-text:light-dark(#252c35,#eaecef);--kl-muted:light-dark(#606874,#b2b9c2);--kl-line:light-dark(#dedfdc,#3d424a);--kl-accent:light-dark(#263f68,#b6ccf1);--kl-onaccent:light-dark(#fff,#172b4c);--kl-soft:light-dark(#e9edf4,#303d51);--kl-good:light-dark(#356644,#a6d0af);--kl-warn:light-dark(#87531c,#e1b77d);font-family:Inter,Arial,sans-serif;color:var(--kl-text);background:var(--kl-bg);font-size:14px;line-height:1.5;border:1px solid var(--kl-line);border-radius:12px;overflow:clip;color-scheme:light dark}
    #kline-concept *{box-sizing:border-box}#kline-concept button,#kline-concept input,#kline-concept select{font:inherit}#kline-concept button{cursor:pointer;color:inherit}#kline-concept button:disabled{opacity:.45;cursor:default}
    #kline-concept .kl-top{display:flex;align-items:center;gap:20px;justify-content:space-between;background:var(--kl-paper);padding:19px 26px;border-bottom:1px solid var(--kl-line)}
    #kline-concept .kl-logo{font-size:19px;letter-spacing:.15em;font-weight:500}#kline-concept .kl-caption{font-size:12px;color:var(--kl-muted)}#kline-concept .kl-branch{font-size:13px;color:var(--kl-muted)}
    #kline-concept .kl-layout{display:grid;grid-template-columns:165px minmax(0,1fr);min-height:590px}#kline-concept .kl-rail{padding:25px 13px;background:var(--kl-paper);border-right:1px solid var(--kl-line)}
    #kline-concept .kl-rail button{display:flex;align-items:center;gap:10px;background:transparent;border:0;border-radius:6px;padding:12px;width:100%;text-align:left;margin-bottom:6px;min-height:44px}
    #kline-concept .kl-rail button[aria-pressed=true]{background:var(--kl-soft);color:var(--kl-accent);font-weight:500}#kline-concept .kl-rail i{width:17px;height:17px}
    #kline-concept .kl-main{padding:30px;min-width:0}#kline-concept h1{font-size:29px;letter-spacing:-.8px;line-height:1.2;font-weight:500;margin:0 0 6px}#kline-concept h2{font-size:19px;font-weight:500;margin:0}#kline-concept h3{font-size:15px;font-weight:500;margin:0}
    #kline-concept p{margin:0}#kline-concept .kl-muted{color:var(--kl-muted)}#kline-concept .kl-head{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:25px;flex-wrap:wrap}
    #kline-concept .kl-button{border:1px solid var(--kl-line);border-radius:6px;background:var(--kl-paper);padding:10px 15px;min-height:44px;display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:normal}
    #kline-concept .kl-primary{background:var(--kl-accent);border-color:var(--kl-accent);color:var(--kl-onaccent)}#kline-concept .kl-link{background:none;border:0;color:var(--kl-accent);padding:10px 0;min-height:44px;text-align:left}
    #kline-concept .kl-kicker{font-size:12px;color:var(--kl-muted);margin-bottom:10px}#kline-concept .kl-section{background:var(--kl-paper);border:1px solid var(--kl-line);border-radius:8px}
    #kline-concept .kl-section-head{padding:18px 20px;border-bottom:1px solid var(--kl-line);display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
    #kline-concept .kl-row{padding:16px 20px;display:grid;grid-template-columns:54px minmax(0,1fr) auto;gap:16px;align-items:center;border-bottom:1px solid var(--kl-line)}#kline-concept .kl-row:last-child{border-bottom:0}
    #kline-concept .kl-thumb{width:54px;height:68px;object-fit:cover;border-radius:4px;background:var(--kl-bg)}#kline-concept .kl-row small{display:block;color:var(--kl-muted);margin-top:3px;font-size:12px}#kline-concept .kl-row strong{font-weight:500}
    #kline-concept .kl-status{color:var(--kl-warn);font-size:12px}#kline-concept .kl-good{color:var(--kl-good)}#kline-concept .kl-foot{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-top:24px;padding-top:18px;border-top:1px solid var(--kl-line)}
    #kline-concept .kl-tabs{display:flex;gap:22px;border-bottom:1px solid var(--kl-line);margin-bottom:22px}#kline-concept .kl-tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:10px 0;min-height:44px;color:var(--kl-muted)}#kline-concept .kl-tabs button[aria-pressed=true]{border-color:var(--kl-accent);color:var(--kl-text)}
    #kline-concept .kl-scope{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}#kline-concept .kl-scope label{display:flex;align-items:center;gap:7px;border:1px solid var(--kl-line);border-radius:5px;padding:7px 10px;background:var(--kl-paper);min-height:40px}#kline-concept input[type=checkbox]{width:17px;height:17px;accent-color:var(--kl-accent)}
    #kline-concept .kl-price-box{display:grid;grid-template-columns:minmax(0,1fr) minmax(170px,.8fr);gap:24px;align-items:center;padding:22px;margin-bottom:20px;background:var(--kl-paper);border:1px solid var(--kl-line);border-radius:8px}
    #kline-concept .kl-money{display:flex;align-items:center;border:1px solid var(--kl-line);border-radius:6px;padding:0 12px;gap:10px;background:var(--kl-paper);color:var(--kl-muted)}#kline-concept .kl-money input{border:0;width:100%;min-width:0;padding:12px 0;background:transparent;color:var(--kl-text);font-size:22px;font-variant-numeric:tabular-nums}
    #kline-concept .kl-input{border:1px solid var(--kl-line);border-radius:5px;padding:10px;background:var(--kl-paper);color:var(--kl-text);width:100%;min-width:0;min-height:44px;font-size:16px}#kline-concept .kl-field{display:grid;gap:7px;margin-bottom:16px}
    #kline-concept details{border-top:1px solid var(--kl-line);padding:14px 0;margin-top:18px}#kline-concept summary{cursor:pointer;color:var(--kl-accent);min-height:40px;align-content:center}#kline-concept .kl-exception{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;margin-top:14px}
    #kline-concept .kl-table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}#kline-concept .kl-table th{font-size:12px;font-weight:400;color:var(--kl-muted);text-align:left;padding:12px 14px;border-bottom:1px solid var(--kl-line)}#kline-concept .kl-table td{padding:13px 14px;border-bottom:1px solid var(--kl-line)}#kline-concept .kl-table td:last-child,#kline-concept .kl-table th:last-child{text-align:right}#kline-concept .kl-table tr:last-child td{border:0}
    #kline-concept .kl-detail{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1fr);gap:28px}#kline-concept .kl-photo{width:100%;max-height:390px;object-fit:contain;background:var(--kl-paper);border-radius:6px}#kline-concept .kl-back{margin-bottom:16px}
    #kline-concept .kl-gallery{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}#kline-concept .kl-product{padding:0;border:0;background:transparent;text-align:left;min-width:0}#kline-concept .kl-product img{width:100%;height:200px;object-fit:cover;border-radius:6px;margin-bottom:10px}#kline-concept .kl-product small{display:block;color:var(--kl-muted);margin-top:4px}
    #kline-concept .kl-note{padding:12px 26px;border-top:1px solid var(--kl-line);color:var(--kl-muted);font-size:12px;background:var(--kl-paper);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}#kline-concept .kl-notice{color:var(--kl-good);margin-bottom:18px}#kline-concept .kl-error{color:light-dark(#a02e28,#ffb4ac);font-size:13px;margin-top:8px}
    #kline-concept .kl-empty{padding:32px 20px;color:var(--kl-muted)}#kline-concept .kl-capture{padding:35px;background:var(--kl-paper);border:1px dashed var(--kl-line);border-radius:8px;margin-top:20px}#kline-concept .kl-capture input{max-width:100%;margin-top:18px}#kline-concept .kl-checkline{display:flex;align-items:center;gap:9px;min-height:44px;margin:10px 0}
    @media(max-width:760px){#kline-concept .kl-layout{grid-template-columns:1fr}#kline-concept .kl-rail{display:flex;gap:4px;padding:9px 16px;border-right:0;border-bottom:1px solid var(--kl-line)}#kline-concept .kl-rail button{justify-content:center;margin:0}#kline-concept .kl-main{padding:24px}#kline-concept .kl-gallery{gap:12px}}
    @media(max-width:500px){#kline-concept .kl-top{padding:16px;gap:12px}#kline-concept .kl-logo{font-size:16px}#kline-concept .kl-main{padding:20px 16px}#kline-concept h1{font-size:26px}#kline-concept .kl-price-box,#kline-concept .kl-detail{grid-template-columns:1fr;gap:16px}#kline-concept .kl-row{grid-template-columns:45px minmax(0,1fr);gap:12px;padding:14px}#kline-concept .kl-row>.kl-button{grid-column:2;justify-self:start;padding:8px 12px}#kline-concept .kl-thumb{width:45px;height:58px}#kline-concept .kl-gallery{grid-template-columns:repeat(2,minmax(0,1fr))}#kline-concept .kl-gallery img{height:165px}#kline-concept .kl-table th,#kline-concept .kl-table td{padding:11px 8px;font-size:12px}#kline-concept .kl-photo{max-height:240px}#kline-concept .kl-rail{padding:8px}#kline-concept .kl-rail button{gap:5px;padding:9px 5px;font-size:13px}#kline-concept .kl-foot .kl-primary{width:100%}#kline-concept .kl-note{padding:12px 16px}#kline-concept .kl-section-head{padding:16px}#kline-concept .kl-capture{padding:22px}}
  </style>
  <header class="kl-top"><div><div class="kl-logo">K–LINE</div><div class="kl-caption">Stock workspace</div></div><div class="kl-branch">Namugongo <span aria-hidden="true">·</span> UGX</div></header>
  <div class="kl-layout">
    <nav class="kl-rail" aria-label="Main navigation"><button data-nav="receiving" aria-pressed="false"><i data-lucide="package-open" aria-hidden="true"></i>Receiving</button><button data-nav="pricing" aria-pressed="false"><i data-lucide="tag" aria-hidden="true"></i>Pricing</button><button data-nav="catalog" aria-pressed="true"><i data-lucide="layout-grid" aria-hidden="true"></i>Stock</button></nav>
    <main class="kl-main" id="kl-content"></main>
  </div>

    const lots=[
      {id:0,name:'Black slim trousers',brand:'H&M',image:photos[0],confirmed:true,received:false,cost:50000,lines:[{size:'30',qty:1,price:null},{size:'32',qty:2,price:95000},{size:'34',qty:3,price:null}]},
      {id:1,name:'Coffee linen trousers',brand:'H&M',image:photos[1],confirmed:false,received:false,cost:50000,lines:[{size:'34',qty:2,price:null},{size:'38',qty:2,price:null}]},
      {id:2,name:'Cream chinos',brand:'Architect',image:photos[2],confirmed:true,received:false,cost:50000,lines:[{size:'34',qty:2,price:100000}]}
    ];
    const state={view:'catalog',mode:'fill',selected:new Set([0,1]),price:'90000',exception:false,exceptionSize:'34',exceptionPrice:'100000',receipt:null,review:null,notice:'',pendingPhotos:[],catalogQuery:'',catalogFilter:'all',stockSize:'all',stockId:0};
    // A separate sample POS snapshot makes current stock independent from unreceived draft quantities.
    const stockProducts=[
      {id:0,name:'Black slim trousers',brand:'H&M',sku:'HM-BLK-01',image:photos[0],lines:[{size:'30',qty:0,price:95000,reorder:2},{size:'32',qty:4,price:95000,reorder:2},{size:'34',qty:1,price:100000,reorder:2}],movements:[{time:'10:38',kind:'Sale',size:'34',change:-1,balance:1},{time:'Yesterday',kind:'Receipt',size:'34',change:2,balance:2}]},
      {id:1,name:'Coffee linen trousers',brand:'H&M',sku:'HM-LIN-02',image:photos[1],lines:[{size:'34',qty:0,price:120000,reorder:2},{size:'38',qty:0,price:120000,reorder:2}],movements:[{time:'09:20',kind:'Sale',size:'38',change:-1,balance:0}]},
      {id:2,name:'Cream chinos',brand:'Architect',sku:'ARC-CRM-03',image:photos[2],lines:[{size:'34',qty:3,price:100000,reorder:2}],movements:[{time:'Yesterday',kind:'Receipt',size:'34',change:3,balance:3}]}
    ];
    const appearance={tone:'Ink blue',density:'Comfortable'};
    const escapeText=value=>String(value).replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
    const currency=value=>value==null?'Not set':Number(value).toLocaleString('en-UG');
    const unitCount=lot=>lot.lines.reduce((total,line)=>total+line.qty,0);
    const isReady=lot=>!lot.received&&lot.confirmed&&lot.cost>0&&lot.lines.every(line=>line.price>0);
    const priceRange=lot=>{const values=lot.lines.map(line=>line.price).filter(value=>value!=null);return values.length?currency(Math.min(...values))+(Math.min(...values)!==Math.max(...values)?'–'+currency(Math.max(...values)):''):'Price needed';};
    const button=(label,attributes='',primary=false)=>`<button class="kl-button ${primary?'kl-primary':''}" ${attributes}>${label}</button>`;
    const pageHeading=(title,subtitle,action='')=>`<div class="kl-head"><div><h1>${title}</h1><p class="kl-muted">${subtitle}</p></div>${action}</div>`;
    const nextTask=lot=>lot.received?'Received':!lot.confirmed?'Confirm quantities':lot.lines.some(line=>line.price==null)?'Set prices':!lot.cost?'Add cost':'Ready for POS';

    // Route all concept screens through a single shell while preserving the pricing draft.
    function renderWorkspace(){
      root.querySelectorAll('[data-nav]').forEach(nav=>nav.setAttribute('aria-pressed',nav.dataset.nav===(state.view==='stock-detail'?'catalog':state.view)));
      const views={receiving:renderReceiving,pricing:renderPricing,catalog:renderCatalog,'stock-detail':renderStockDetail,intake:renderIntake,detail:renderDetail,publish:renderPublication};
      content.innerHTML=(state.notice?`<p class="kl-notice" role="status">${escapeText(state.notice)}</p>`:'')+(views[state.view]||renderReceiving)();
      if(globalThis.lucide) lucide.createIcons({attrs:{width:17,height:17}});
    }

    // Receiving keeps unfinished work in one batch and derives next actions from the lot state.
    function renderReceiving(){
      const active=lots.filter(lot=>!lot.received),ready=active.filter(isReady);
      return pageHeading('Receiving','New stock, ready for its next step.',button('+ Add stock','data-action="intake"',true))+`<div class="kl-kicker">SUNDAY, 6 SEPTEMBER</div><section class="kl-section"><div class="kl-section-head"><div><h2>Today’s intake</h2><p class="kl-muted">${lots.length} photographed lots · ${lots.reduce((n,lot)=>n+unitCount(lot),0)} units</p></div><span class="kl-muted">Namugongo</span></div>${lots.map(lot=>`<div class="kl-row"><img class="kl-thumb" src="${lot.image}" alt="${escapeText(lot.name)}"><div><strong>${escapeText(lot.name)}</strong><small>${escapeText(lot.brand)} · ${unitCount(lot)} units · ${lot.lines.length} size${lot.lines.length===1?'':'s'}</small><span class="kl-status ${isReady(lot)||lot.received?'kl-good':''}">${nextTask(lot)}</span></div>${button(lot.received?'View receipt':!lot.confirmed?'Check quantities':isReady(lot)?'View item':'Set price',`data-lot="${lot.id}" data-action="${!lot.confirmed||!lot.cost||isReady(lot)||lot.received?'detail':'price-lot'}"`)}</div>`).join('')}</section><div class="kl-foot"><span class="kl-muted">${ready.length} ready · ${active.length-ready.length} still preparing</span>${ready.length?button('Review '+ready.reduce((n,lot)=>n+unitCount(lot),0)+' units for POS','data-action="publish"',true):button('Open pricing','data-action="pricing"')}</div>`;
    }

    // Only explicit targets enter a plan; fill mode protects all previously priced size lines.
    function proposedChanges(){
      const amount=Number(state.price.replace(/,/g,'')),exception=Number(state.exceptionPrice.replace(/,/g,''));
      if(!Number.isFinite(amount)||amount<=0||amount>99999999.99||(state.exception&&(!Number.isFinite(exception)||exception<=0||exception>99999999.99)))return null;
      return lots.filter(lot=>!lot.received&&state.selected.has(lot.id)).flatMap(lot=>lot.lines.map((line,index)=>({lot:lot.id,index,name:lot.name,size:line.size,qty:line.qty,before:line.price,after:state.mode==='fill'&&line.price!=null?line.price:state.exception&&line.size===state.exceptionSize?exception:amount}))).filter(row=>row.before!==row.after);
    }

    // Ordinary pricing exposes a shared price first; size differences are an optional disclosure.
    function renderPricing(){
      if(state.review)return renderPriceReview();
      const changes=proposedChanges(),editable=lots.filter(lot=>!lot.received&&(state.mode==='revise'||lot.lines.some(line=>line.price==null)));
      if(state.mode==='history')return pageHeading('Pricing','Price changes and receipts.')+renderPricingTabs()+`<section class="kl-section">${state.receipt?`<div class="kl-section-head"><div><h3>Today · ${state.receipt.length} size prices saved</h3><span class="kl-muted">Namugongo · Sample operator</span></div>${button('Undo price changes','data-action="undo"')}</div>`:'<p class="kl-empty">No price changes in this concept yet.</p>'}</section>`;
      const selected=editable.filter(lot=>state.selected.has(lot.id));
      return pageHeading('Pricing','${scope}') .replace('${scope}','Today’s intake · Namugongo')+renderPricingTabs()+`<div class="kl-scope">${editable.map(lot=>`<label><input type="checkbox" data-scope="${lot.id}" ${state.selected.has(lot.id)?'checked':''}>${escapeText(lot.name)}</label>`).join('')||'<p class="kl-muted">All received or priced. Change prices remains available for unpublished stock.</p>'}</div><div class="kl-price-box"><div><h2>One price for selected items</h2><p class="kl-muted">${selected.length} lots${state.mode==='fill'?' · existing prices stay as they are':''}</p></div><label class="kl-money"><span>UGX</span><input aria-label="Shared unit selling price" id="kl-shared-price" inputmode="decimal" value="${escapeText(state.price)}"></label></div><div id="kl-validation" class="kl-error" role="alert" ${changes?'hidden':''}>Enter a valid price greater than zero.</div><section class="kl-section">${selected.map(lot=>`<div class="kl-row"><img class="kl-thumb" src="${lot.image}" alt="${escapeText(lot.name)}"><div><strong>${escapeText(lot.name)}</strong><small>${lot.lines.map(line=>line.size+' × '+line.qty).join(' · ')}<br>${state.mode==='fill'&&lot.lines.some(line=>line.price!=null)?'Existing size prices protected':'All selected sizes'}</small></div><span class="kl-muted">${unitCount(lot)} units</span></div>`).join('')||'<p class="kl-empty">Select merchandise to price.</p>'}</section><details ${state.exception?'open':''}><summary>Different price for a size</summary><label class="kl-checkline"><input id="kl-exception" type="checkbox" ${state.exception?'checked':''}>Add size exception</label>${state.exception?`<div class="kl-exception"><label class="kl-field">Waist size<select class="kl-input" id="kl-exception-size">${[...new Set(selected.flatMap(lot=>lot.lines.map(line=>line.size)))].map(size=>`<option ${size===state.exceptionSize?'selected':''}>${size}</option>`).join('')}</select></label><label class="kl-field">Unit price · UGX<input class="kl-input" id="kl-exception-price" inputmode="decimal" value="${escapeText(state.exceptionPrice)}"></label></div>`:''}</details><div class="kl-foot"><span id="kl-impact" class="kl-muted" aria-live="polite">${changes?changes.length:0} size prices will change</span>${button('Review prices','data-action="review-prices" '+(!changes?.length?'disabled':''),true)}</div>`;
    }
    function renderPricingTabs(){return `<div class="kl-tabs" aria-label="Pricing tasks">${[['fill','Unpriced'],['revise','Change prices'],['history','History']].map(([value,label])=>`<button data-mode="${value}" aria-pressed="${state.mode===value}">${label}</button>`).join('')}</div>`;}

    // The review is a frozen, exact before/after list; this concept only mutates in-memory sample data.
    function renderPriceReview(){
      const rows=state.review;
      return `<button class="kl-link kl-back" data-action="back-pricing">← Back to prices</button>`+pageHeading('Review prices',`${rows.length} size prices · ${rows.reduce((n,row)=>n+row.qty,0)} units · Namugongo`)+`<section class="kl-section"><table class="kl-table"><thead><tr><th>Item / waist</th><th>Units</th><th>Before</th><th>After · UGX</th></tr></thead><tbody>${rows.map(row=>`<tr><td>${escapeText(row.name)}<br><span class="kl-muted">Waist ${row.size}</span></td><td>${row.qty}</td><td>${currency(row.before)}</td><td>${currency(row.after)}</td></tr>`).join('')}</tbody></table></section><div class="kl-foot"><span class="kl-muted">Prices only · POS receipt is separate</span>${button('Save '+rows.length+' size prices','data-action="save-prices"',true)}</div>`;
    }

    // Product details combine an editable identity and physical counts, keeping confirmed stock explicit.
    function renderDetail(){
      const lot=lots.find(item=>item.id===state.detailId)||lots[0];
      return `<button class="kl-link kl-back" data-action="receiving">← Receiving</button>`+pageHeading(lot.received?'Receipt details':'Complete item',`${escapeText(lot.brand)} · ${unitCount(lot)} units · Namugongo`)+`<div class="kl-detail"><img class="kl-photo" src="${lot.image}" alt="${escapeText(lot.name)}"><div><label class="kl-field">Product name<input class="kl-input" id="kl-product-name" value="${escapeText(lot.name)}" ${lot.received?'readonly':''}></label><h3>${lot.received?'Quantities received':'Sizes & quantities'}</h3><table class="kl-table"><thead><tr><th>Waist</th><th>Quantity</th><th>Price · UGX</th></tr></thead><tbody>${lot.lines.map((line,index)=>`<tr><td>${lot.received?line.size:`<input class="kl-input" style="max-width:80px" aria-label="Waist size ${index+1}" data-size="${index}" value="${escapeText(line.size)}">`}</td><td>${lot.received?line.qty:`<input class="kl-input" style="max-width:76px" type="number" min="1" max="10000" aria-label="Quantity for waist ${line.size}" data-quantity="${index}" value="${line.qty}">`}</td><td>${currency(line.price)}</td></tr>`).join('')}</tbody></table><p class="kl-muted" style="margin-top:14px">${lot.received?'Received successfully · receipt quantities, not current shop stock.':lot.confirmed?'Quantities confirmed':'Quantities suggested · awaiting your check'}</p>${!lot.received?'<label class="kl-checkline"><input id="kl-count-confirm" type="checkbox" '+(lot.confirmed?'checked':'')+'>I have checked these quantities</label>':''}${lot.received?'<p class="kl-good">Cost recorded</p>':`<label class="kl-field">Unit cost / UGX<input class="kl-input" id="kl-cost" inputmode="decimal" value="${lot.cost??''}"></label>`}</div></div><div id="kl-detail-error" class="kl-error" role="alert"></div><div class="kl-foot"><span class="kl-muted">${lot.received?'POS links belong on this receipt in the connected app.':'All changes stay in receiving until POS handoff.'}</span>${lot.received?button('Back to receiving','data-action="receiving"'):button('Save item','data-action="save-item"',true)}</div>`;
    }

    // Publication review counts only ready lots and records a local success state, never an API request.
    function renderPublication(){
      const ready=lots.filter(isReady),units=ready.reduce((n,lot)=>n+unitCount(lot),0);
      return `<button class="kl-link kl-back" data-action="receiving">← Receiving</button>`+pageHeading('Receive into POS',`Namugongo · ${ready.length} products · ${units} units`)+`<section class="kl-section">${ready.map(lot=>`<div class="kl-row"><img class="kl-thumb" src="${lot.image}" alt="${escapeText(lot.name)}"><div><strong>${escapeText(lot.name)}</strong><small>${lot.lines.map(line=>line.size+' × '+line.qty).join(' · ')}<br>UGX ${priceRange(lot)} each</small></div><span class="kl-good">Ready</span></div>`).join('')||'<p class="kl-empty">No items are ready to receive.</p>'}</section><div class="kl-foot"><span class="kl-muted">Approval will add these units to branch stock.</span>${button('Receive '+units+' units','data-action="receive" '+(!ready.length?'disabled':''),true)}</div>`;
    }

    // Stock filters count only matching sizes from the POS snapshot, never intake evidence rows.
    function renderCatalog(){
      const matches=stockProducts.map(product=>({...product,lines:product.lines.filter(line=>state.stockSize==='all'||line.size===state.stockSize)})).filter(product=>product.lines.length&&(product.name+' '+product.brand+' '+product.sku).toLowerCase().includes(state.catalogQuery.toLowerCase())).filter(product=>state.catalogFilter==='all'||(state.catalogFilter==='low'?product.lines.some(line=>line.qty>0&&line.reorder!=null&&line.qty<=line.reorder):product.lines.every(line=>line.qty===0)));
      return pageHeading('Stock','Namugongo · Sample POS snapshot, 10:42')+`<div class="kl-exception"><label class="kl-field">Search stock<input class="kl-input" id="kl-search" type="search" placeholder="Name, brand or SKU" value="${escapeText(state.catalogQuery)}"></label><label class="kl-field">Waist size<select id="kl-stock-size" class="kl-input" aria-label="Waist size">${['all','30','32','34','38'].map(size=>`<option value="${size}" ${state.stockSize===size?'selected':''}>${size==='all'?'All sizes':size}</option>`).join('')}</select></label></div><div class="kl-tabs">${[['all','All stock'],['low','Low stock'],['out','Out of stock']].map(([value,label])=>`<button data-catalog-filter="${value}" aria-pressed="${state.catalogFilter===value}">${label}</button>`).join('')}</div><div class="kl-gallery">${matches.map(product=>`<button class="kl-product" data-action="stock-detail" data-stock="${product.id}"><img src="${product.image}" alt="${escapeText(product.name)}"><h3>${escapeText(product.name)}</h3><small>UGX ${priceRange(product)}</small><p style="margin-top:8px">${unitCount(product)} units${state.stockSize==='all'?'':' · waist '+state.stockSize}</p><small>${product.lines.map(line=>line.size+': '+line.qty).join(' · ')}</small><span class="kl-status">${unitCount(product)===0?'Out of stock':product.lines.some(line=>line.qty>0&&line.qty<=line.reorder)?'Low: waist '+product.lines.filter(line=>line.qty>0&&line.qty<=line.reorder).map(line=>line.size).join(', '):'In stock'}</span></button>`).join('')||'<p class="kl-empty">No matching stock.</p>'}</div><div class="kl-foot"><span class="kl-muted" aria-live="polite">${matches.length} products · ${matches.reduce((n,product)=>n+unitCount(product),0)} units${state.stockSize==='all'?'':' in waist '+state.stockSize}</span><span class="kl-muted">Current stock and selling prices</span></div>`;
    }

    // A product opens current size availability and the movement evidence behind recent changes.
    function renderStockDetail(){
      const product=stockProducts.find(item=>item.id===state.stockId);
      return `<button class="kl-link kl-back" data-action="catalog">← Stock</button>`+pageHeading(escapeText(product.name),`${escapeText(product.sku)} · Namugongo`)+`<div class="kl-detail"><img class="kl-photo" src="${product.image}" alt="${escapeText(product.name)}"><div><h2>${unitCount(product)} units on hand</h2><p class="kl-muted">Sample POS snapshot · 10:42</p><table class="kl-table"><thead><tr><th>Waist</th><th>On hand</th><th>Price · UGX</th></tr></thead><tbody>${product.lines.map(line=>`<tr><td>${line.size}<br><span class="kl-status">${line.qty===0?'Out of stock':line.qty<=line.reorder?'Low stock':''}</span></td><td>${line.qty}</td><td>${currency(line.price)}</td></tr>`).join('')}</tbody></table><p class="kl-muted" style="margin-top:14px">${product.lines.every(line=>line.reorder===2)?'Reorder level: 2 per size in this sample':'Reorder levels not configured'}</p></div></div><section class="kl-section" style="margin-top:24px"><div class="kl-section-head"><h2>Recent movements</h2><span class="kl-muted">Namugongo</span></div><table class="kl-table"><thead><tr><th>When / movement</th><th>Waist</th><th>Change</th><th>Balance</th></tr></thead><tbody>${product.movements.map(movement=>`<tr><td>${movement.time}<br>${movement.kind}</td><td>${movement.size}</td><td>${movement.change>0?'+':''}${movement.change}</td><td>${movement.balance}</td></tr>`).join('')}</tbody></table></section>`;
    }

    // Intake previews local files only; sample additions stay in memory and are clearly unconnected to POS.
    function renderIntake(){
      return `<button class="kl-link kl-back" data-action="receiving">← Receiving</button>`+pageHeading('Add stock','Today’s intake · Namugongo')+`<label class="kl-field">Category<select class="kl-input"><option>Trousers</option></select></label><section class="kl-capture"><h2>Photograph the next item</h2><label class="kl-field">Product photos<input id="kl-files" type="file" accept="image/*" multiple></label><p class="kl-muted">${state.pendingPhotos.length?state.pendingPhotos.length+' photos selected':'Local preview only in this concept'}</p></section><div class="kl-foot"><span class="kl-muted">Details and counts can follow.</span>${button('Add to receiving','data-action="add-photos" '+(!state.pendingPhotos.length?'disabled':''),true)}</div>`;
    }

    // Update price impact without replacing the focused input while the user types.
    function refreshPriceImpact(){
      const changes=proposedChanges();
      content.querySelector('#kl-impact').textContent=`${changes?.length||0} size prices will change`;
      content.querySelector('[data-action="review-prices"]').disabled=!changes?.length;
      content.querySelector('#kl-validation').hidden=!!changes;
    }

    // Delegate screen actions so navigation, review, and local receipts share the same state model.
    root.addEventListener('click',event=>{
      const target=event.target.closest('button');if(!target)return;
      if(target.dataset.nav){state.view=target.dataset.nav;state.notice='';state.review=null;renderWorkspace();return;}
      if(target.dataset.mode){state.mode=target.dataset.mode;state.selected=new Set(lots.filter(lot=>!lot.received).map(lot=>lot.id));renderWorkspace();return;}
      if(target.dataset.catalogFilter){state.catalogFilter=target.dataset.catalogFilter;renderWorkspace();return;}
      const action=target.dataset.action;state.notice='';
      if(['receiving','pricing','intake','publish','catalog'].includes(action))state.view=action;
      if(action==='stock-detail'){state.stockId=Number(target.dataset.stock);state.view='stock-detail';}
      if(action==='detail'){state.detailId=Number(target.dataset.lot);state.view='detail';}
      if(action==='price-lot'){state.selected=new Set([Number(target.dataset.lot)]);state.mode='fill';state.view='pricing';}
      if(action==='review-prices'){state.review=proposedChanges();if(!state.review?.length)return;}
      if(action==='back-pricing')state.review=null;
      if(action==='save-prices'){state.receipt=state.review;state.review.forEach(row=>lots.find(lot=>lot.id===row.lot).lines[row.index].price=row.after);state.review=null;state.notice='Prices saved in this concept. Stock is still in receiving.';state.view='receiving';}
      if(action==='undo'){if(state.receipt?.some(row=>lots.find(lot=>lot.id===row.lot).received)){state.notice='These prices are part of a POS receipt. Undo is unavailable.';}else{state.receipt?.forEach(row=>lots.find(lot=>lot.id===row.lot).lines[row.index].price=row.before);state.receipt=null;state.notice='Price changes reversed in this concept.';}}
      if(action==='save-item'){
        const lot=lots.find(item=>item.id===state.detailId),name=content.querySelector('#kl-product-name').value.trim(),quantities=[...content.querySelectorAll('[data-quantity]')].map(input=>Number(input.value));
        if(!name||quantities.some(qty=>!Number.isInteger(qty)||qty<1||qty>10000)){content.querySelector('#kl-detail-error').textContent='Add a product name and whole quantities from 1 to 10,000.';return;}
        const sizes=[...content.querySelectorAll('[data-size]')].map(input=>input.value.trim()),costText=content.querySelector('#kl-cost').value.trim(),cost=costText?Number(costText.replace(/,/g,'')):null;if(sizes.some(size=>!size||size==='To confirm')||(costText&&(!Number.isFinite(cost)||cost<=0))){content.querySelector('#kl-detail-error').textContent='Confirm waist sizes and enter a positive cost, or leave cost blank.';return;}lot.cost=cost;sizes.forEach((size,index)=>lot.lines[index].size=size);lot.name=name;quantities.forEach((qty,index)=>lot.lines[index].qty=qty);lot.confirmed=content.querySelector('#kl-count-confirm').checked;state.view='receiving';state.notice='Item saved in this concept.';
      }
      if(action==='receive'){const ready=lots.filter(isReady);ready.forEach(lot=>{lot.received=true;stockProducts.push({id:stockProducts.length,name:lot.name,brand:lot.brand,sku:'NEW-'+lot.id,image:lot.image,lines:lot.lines.map(line=>({...line,reorder:null})),movements:lot.lines.map(line=>({time:'Now',kind:'Receipt',size:line.size,change:line.qty,balance:line.qty}))});});state.notice=`Sample receipt: ${ready.reduce((n,lot)=>n+unitCount(lot),0)} units added to the sample Stock view as new POS products. No real stock changed.`;state.view='receiving';}
      if(action==='add-photos'){state.pendingPhotos.forEach(photo=>lots.push({id:lots.length,name:'New trousers',brand:'Unclassified',image:photo,confirmed:false,received:false,cost:null,lines:[{size:'To confirm',qty:1,price:null}]}));state.pendingPhotos=[];state.view='receiving';state.notice='Local photos added to the concept. Nothing was uploaded.';}
      renderWorkspace();
    });

    // Bind typed values without network or storage writes; re-render only for structural changes.
    root.addEventListener('input',event=>{
      if(event.target.id==='kl-shared-price'){state.price=event.target.value;refreshPriceImpact();}
      if(event.target.id==='kl-exception-price'){state.exceptionPrice=event.target.value;refreshPriceImpact();}
      if(event.target.id==='kl-search'){const position=event.target.selectionStart;state.catalogQuery=event.target.value;renderWorkspace();const search=content.querySelector('#kl-search');search.focus();search.setSelectionRange(position,position);}
    });
    root.addEventListener('change',event=>{
      if(event.target.id==='kl-stock-size'){state.stockSize=event.target.value;renderWorkspace();}
      if(event.target.dataset.scope){const id=Number(event.target.dataset.scope);event.target.checked?state.selected.add(id):state.selected.delete(id);renderWorkspace();}
      if(event.target.id==='kl-exception'){state.exception=event.target.checked;renderWorkspace();}
      if(event.target.id==='kl-exception-size'){state.exceptionSize=event.target.value;refreshPriceImpact();}
      if(event.target.id==='kl-files'){state.pendingPhotos=[...event.target.files].filter(file=>file.type.startsWith('image/')).map(file=>URL.createObjectURL(file));renderWorkspace();}
    });
    // Host-only design choices change visual treatment while retaining identical business interactions.
    function applyAppearance(){
      root.style.setProperty('--kl-accent',appearance.tone==='Graphite'?'light-dark(#333b45,#d0d5dd)':'light-dark(#263f68,#b6ccf1)');
      root.style.setProperty('--kl-onaccent',appearance.tone==='Graphite'?'light-dark(#fff,#242a31)':'light-dark(#fff,#172b4c)');
      content.style.padding=appearance.density==='Compact'?'20px':'';
    }
    renderWorkspace();
    if(globalThis.Tweak){const tweak=new Tweak({container:root,onChange:applyAppearance});tweak.addSelect(appearance,'tone',{label:'Action color',options:['Ink blue','Graphite']});tweak.addSelect(appearance,'density',{label:'Spacing',options:['Comfortable','Compact']});}
  })();
  </script>
</div>
