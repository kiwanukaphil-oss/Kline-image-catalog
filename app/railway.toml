# Legacy config reference, retained for review. Railway service settings are
# authoritative; its build engine installs dependencies before this command.
[build]
buildCommand = "npm run build"

[deploy]
startCommand = "node dist/standalone/server.js"
healthcheckPath = "/"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
